<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Team &mdash; Standings</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef4f3;color:#17211f;margin:0;padding:20px;}.wrap{max-width:760px;margin:0 auto;background:#fff;border:1px solid #e1e7e5;border-radius:12px;padding:20px;}.tw{overflow-x:auto;}h1{font-size:1.4rem;margin:0 0 14px;color:#fff;background:linear-gradient(110deg,#0b5e53,#0d7976 45%,#2452a6);padding:14px 16px;border-radius:12px;}.meta{color:#5f6e6b;font-size:.85rem;margin:0 0 14px;}.back{margin:0 0 10px;font-size:.8rem;}.back a{color:#0e7c78;text-decoration:none;}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:0 0 14px;font-size:.85rem;color:#5f6e6b;}.controls label{display:inline-flex;align-items:center;white-space:nowrap;margin:0;}.controls select,.controls input{font:inherit;padding:5px 8px;border:1px solid #cfdcd9;border-radius:7px;background:#fff;color:#17211f;margin-left:6px;}.controls input{width:56px;}table{border-collapse:collapse;width:100%;font-size:.92rem;}th,td{padding:7px 8px;text-align:center;border-bottom:1px solid #e1e7e5;font-variant-numeric:tabular-nums;white-space:nowrap;}th{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:#5f6e6b;cursor:pointer;user-select:none;}th:hover{color:#0e7c78;}th.sorted{color:#0e7c78;}th.nm,td.nm{text-align:left;}tbody tr:nth-child(odd){background:#f0f6f5;}.ft{color:#9a9a9a;font-size:.72rem;margin-top:14px;text-align:center;}.sechead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;margin:4px 0 10px;}.secttl{font-size:1rem;font-weight:700;color:#17211f;}.sechead .cv{color:#5f6e6b;font-size:.85rem;}.secttl2{font-size:1rem;font-weight:700;color:#17211f;margin:20px 0 10px;}.lead{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 4px;}.lcard{background:linear-gradient(135deg,#f0f6f5,#e6efee);border:1px solid #dbe6e4;border-radius:10px;padding:9px 11px;}.lk{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:#0d7976;font-weight:800;text-align:center;margin-bottom:6px;}.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;padding:1px 1px;}.lrow .lnm{color:#5f6e6b;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}.lrow .lval{color:#5f6e6b;font-size:.82rem;font-weight:600;flex-shrink:0;}.lrow.l1{margin-bottom:2px;}.lrow.l1 .lnm{font-size:.9rem;font-weight:700;color:#17211f;}.lrow.l1 .lval{font-size:1.4rem;font-weight:700;color:#17211f;line-height:1.1;}@media(max-width:560px){.lead{grid-template-columns:repeat(2,1fr);}.lrow.l2,.lrow.l3{display:none;}.lcard{text-align:center;}.lk{color:#5f6e6b;font-weight:600;font-size:.65rem;letter-spacing:.05em;margin-bottom:2px;}.lrow.l1{flex-direction:column-reverse;align-items:center;gap:0;margin-bottom:0;}.lrow.l1 .lval{font-size:1.5rem;font-weight:700;color:#0d7976;line-height:1.15;margin:2px 0;}.lrow.l1 .lnm{font-size:.78rem;font-weight:400;color:#17211f;}}</style></head><body><div class="wrap"><p class="back"><a href="index.html">&larr; All teams</a></p><h1>My Team</h1><p class="meta">Standings &middot; <span id="scopeLabel"></span> &middot; <span id="gcount"></span> &middot; updated 7/1/2026</p><div class="controls"><label>Season<select id="seasonSel" onchange="render()"><option value="all" selected>All time</option></select></label><label>Min games<input id="minG" type="number" min="1" value="1" onchange="setMinG(this.value)"></label></div><div class="sechead" onclick="toggleLeaders()"><span class="secttl">Stat Leaders</span><span class="cv" id="leadCaret">&#9662;</span></div><div class="lead" id="leaders"></div><h2 class="secttl2">Full Stats</h2><div class="tw" id="tbl"></div><p class="ft">Read-only snapshot &middot; tap a column header to sort &middot; set Min games to rank qualified players</p></div><script>
const DATA={"team":"My Team","games":[]};

const RATE=['avg','obp','slg','ops'];
const COLS=[['player','Player'],['g','G'],['pa','PA'],['ab','AB'],['h','H'],['hr','HR'],['r','R'],['rbi','RBI'],['bb','BB'],['avg','AVG'],['obp','OBP'],['slg','SLG'],['ops','OPS']];
let sortK='avg',sortDir=-1,minG=1;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function fmt3(v){return v.toFixed(3).replace(/^0/,'');}
function agg(scope){
  const games=scope==='all'?DATA.games:DATA.games.filter(function(g){return g.season===scope;});
  const tot={};
  games.forEach(function(g){g.lines.forEach(function(l){
    let t=tot[l.p];
    if(!t){t=tot[l.p]={player:l.p,g:0,ab:0,b1:0,b2:0,b3:0,hr:0,bb:0,r:0,rbi:0};}
    t.g++;t.ab+=l.ab;t.b1+=l.b1;t.b2+=l.b2;t.b3+=l.b3;t.hr+=l.hr;t.bb+=l.bb;t.r+=l.r;t.rbi+=l.rbi;
  });});
  return Object.keys(tot).map(function(k){
    const t=tot[k];t.h=t.b1+t.b2+t.b3+t.hr;t.pa=t.ab+t.bb;const tb=t.b1+2*t.b2+3*t.b3+4*t.hr;
    t.avg=t.ab?t.h/t.ab:0;t.obp=(t.ab+t.bb)?(t.h+t.bb)/(t.ab+t.bb):0;t.slg=t.ab?tb/t.ab:0;t.ops=t.obp+t.slg;return t;
  });
}
function setSort(i){var k=COLS[i][0];if(sortK===k){sortDir=-sortDir;}else{sortK=k;sortDir=(k==='player')?1:-1;}render();}
function setMinG(v){minG=Math.max(1,parseInt(v)||1);render();}
var LEAD=[['avg','AVG',1],['obp','OBP',1],['slg','SLG',1],['ops','OPS',1],['hr','HR',0],['rbi','RBI',0],['r','R',0],['h','H',0]];
function renderLeaders(rows){
  var el=document.getElementById('leaders');
  if(!el)return;
  var pool=rows.filter(function(t){return t.ab>0;});
  if(!pool.length){el.innerHTML='';return;}
  var h='';
  LEAD.forEach(function(c){
    var key=c[0],rate=c[2];
    var top=pool.slice().sort(function(a,b){return b[key]-a[key];}).slice(0,3);
    var body='';
    top.forEach(function(t,i){
      var val=rate?fmt3(t[key]):String(t[key]);
      body+='<div class="lrow l'+(i+1)+'"><span class="lnm">'+esc(t.player)+'</span><span class="lval">'+val+'</span></div>';
    });
    h+='<div class="lcard"><div class="lk">'+c[1]+'</div>'+body+'</div>';
  });
  el.innerHTML=h;
}
function toggleLeaders(){
  var el=document.getElementById('leaders');var c=document.getElementById('leadCaret');
  if(!el)return;var hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  if(c)c.textContent=hidden?'▾':'▸';
}
function render(){
  const scope=document.getElementById('seasonSel').value;
  let rows=agg(scope).filter(function(t){return t.g>=minG;});
  rows.sort(function(a,b){var av=a[sortK],bv=b[sortK];if(typeof av==='string')return sortDir*String(av).localeCompare(String(bv));return sortDir*(av-bv);});
  const gc=scope==='all'?DATA.games.length:DATA.games.filter(function(g){return g.season===scope;}).length;
  document.getElementById('scopeLabel').textContent=scope==='all'?'All time':scope;
  document.getElementById('gcount').textContent=gc+' game'+(gc===1?'':'s');
  renderLeaders(rows);
  const tbl=document.getElementById('tbl');
  if(!rows.length){tbl.innerHTML='<p style="color:#5f6e6b">No players'+(minG>1?' with '+minG+'+ games':'')+(scope==='all'?'':' for '+esc(scope))+'.</p>';return;}
  let h='<table><thead><tr>'+COLS.map(function(c,i){var ar=c[0]===sortK?(sortDir<0?' ▾':' ▴'):'';return '<th onclick="setSort('+i+')" class="'+(c[0]==='player'?'nm ':'')+(c[0]===sortK?'sorted':'')+'">'+c[1]+ar+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(t){h+='<tr>'+COLS.map(function(c){let v=t[c[0]];if(RATE.indexOf(c[0])>=0)v=fmt3(v);return '<td class="'+(c[0]==='player'?'nm':'')+'">'+(c[0]==='player'?esc(v):v)+'</td>';}).join('')+'</tr>';});
  h+='</tbody></table>';tbl.innerHTML=h;
}
render();

</script></body></html>
